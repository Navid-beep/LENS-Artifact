  gateInvariant: \gate.rob_instance.ROB_state [0] == 0 || \gate.rob_instance.ROB_state
    [0] == 1 || \gate.rob_instance.ROB_state [0] == 2 || \gate.rob_instance.ROB_state
    [0] == 5
  goldInvariant: \gold.rob_instance.ROB_state [0] == 0 || \gold.rob_instance.ROB_state
    [0] == 1 || \gold.rob_instance.ROB_state [0] == 2 || \gold.rob_instance.ROB_state
    [0] == 5
  invariant: rob_instance.ROB_state [0] == 0 || rob_instance.ROB_state [0] == 1 ||
    rob_instance.ROB_state [0] == 2 || rob_instance.ROB_state [0] == 5
  module: rob
- condition: []
  dataSignals:
  - rob_instance.ROB_state
  gateInvariant: \gate.rob_instance.ROB_state [1] == 0 || \gate.rob_instance.ROB_state
    [1] == 1 || \gate.rob_instance.ROB_state [1] == 2 || \gate.rob_instance.ROB_state
    [1] == 5
  goldInvariant: \gold.rob_instance.ROB_state [1] == 0 || \gold.rob_instance.ROB_state
    [1] == 1 || \gold.rob_instance.ROB_state [1] == 2 || \gold.rob_instance.ROB_state
    [1] == 5
  invariant: rob_instance.ROB_state [1] == 0 || rob_instance.ROB_state [1] == 1 ||
