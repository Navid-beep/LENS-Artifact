  goldInvariant: \gold.F_opcode == 0 || \gold.F_opcode == 1 || \gold.F_opcode == 2
    || \gold.F_opcode == 3 || \gold.F_opcode == 4 || \gold.F_opcode == 5
  invariant: F_opcode == 0 || F_opcode == 1 || F_opcode == 2 || F_opcode == 3 || F_opcode
