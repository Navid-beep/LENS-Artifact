  - rob_instance.ROB_op
  gateInvariant: \gate.rob_instance.ROB_state [0] == 0 || \gate.rob_instance.ROB_op
    [0] <= 5
  goldInvariant: \gold.rob_instance.ROB_state [0] == 0 || \gold.rob_instance.ROB_op
    [0] <= 5
  invariant: rob_instance.ROB_state [0] == 0 || rob_instance.ROB_op [0] <= 5
  module: rob
- condition: []
