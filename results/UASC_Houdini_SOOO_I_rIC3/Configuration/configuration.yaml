avrPath: ''
contract:
  AttackerObservation:
  - condition: []
    dataSignal: rob_instance.C_valid
    module: rob
    width: 1
  - condition: []
    dataSignal: rob_instance.ld_addr
    module: rob
    width: 2
  Predicate:
  - compare: equal_and_both
    invariant: '! {cp}.renameTable_instance.renameTB_valid [{i}] || ( {cp}.rob_instance.ROB_state
      [ {cp}.renameTable_instance.renameTB_ROBlink [{i}] ] != 0 && {cp}.rob_instance.ROB_wen
      [ {cp}.renameTable_instance.renameTB_ROBlink [{i}] ] && {cp}.rob_instance.ROB_rd
      [ {cp}.renameTable_instance.renameTB_ROBlink [{i}] ] == 2''d{i} )'
    name: rename_points_to_live_writer
    range: 4
  - compare: equal_and_both
    invariant: '{cp}.rob_instance.ROB_state [{i}] != 5 || {cp}.rob_instance.ROB_next_pc
      [{i}] == ( ( {cp}.rob_instance.ROB_is_br [{i}] && {cp}.rob_instance.ROB_taken
      [{i}] ) ? ( {cp}.rob_instance.ROB_pc [{i}] + {cp}.rob_instance.ROB_rs1_br_offset
      [{i}] ) : ( {cp}.rob_instance.ROB_pc [{i}] + 3''d1 ) )'
    name: rob_next_pc_finished
    range: 4
  - compare: equal_and_both
    invariant: '{cp}.rob_instance.ROB_predicted_taken == 4''d0'
    name: rob_no_prediction
  - compare: equal_and_both
    invariant: '{cp}.rob_instance.ROB_state [{i}] == 0 || ! {cp}.rob_instance.ROB_rs1_stall
      [{i}] || ( {cp}.rob_instance.ROB_state [{i}] == 1 && {cp}.rob_instance.ROB_state
      [ {cp}.rob_instance.ROB_rs1_ROBlink [{i}] ] != 0 )'
    name: rob_rs1_pending_link
    range: 4
  - compare: equal_and_both
    invariant: '{cp}.rob_instance.ROB_state [{i}] == 0 || ! {cp}.rob_instance.ROB_rs2_stall
      [{i}] || ( {cp}.rob_instance.ROB_state [{i}] == 1 && {cp}.rob_instance.ROB_state
      [ {cp}.rob_instance.ROB_rs2_ROBlink [{i}] ] != 0 )'
    name: rob_rs2_pending_link
    range: 4
  - compare: equal_and_both
    invariant: ( !( ( 3'd{i} - {cp}.rob_instance.ROB_head ) < ( {cp}.rob_instance.ROB_tail
      - {cp}.rob_instance.ROB_head ) ) || {cp}.rob_instance.ROB_state [{i}] != 0 )
      && ( ( ( 3'd{i} - {cp}.rob_instance.ROB_head ) < ( {cp}.rob_instance.ROB_tail
      - {cp}.rob_instance.ROB_head ) ) || {cp}.rob_instance.ROB_state [{i}] == 0 ||
      ( {cp}.rob_instance.ROB_tail == {cp}.rob_instance.ROB_head && {cp}.rob_instance.ROB_state
      [ {cp}.rob_instance.ROB_head ] != 0 ) ) && ( {cp}.rob_instance.ROB_tail != {cp}.rob_instance.ROB_head
      || ( {cp}.rob_instance.ROB_state [{i}] != 0 ) == ( {cp}.rob_instance.ROB_state
      [ {cp}.rob_instance.ROB_head ] != 0 ) )
    name: rob_window_occupancy
    range: 4
  - compare: equal_and_both
    invariant: '{cp}.rob_instance.ROB_state [{i}] == 0 || ( ( ! {cp}.rob_instance.ROB_rs1_stall
      [{i}] || ( ( {cp}.rob_instance.ROB_rs1_ROBlink [{i}] - {cp}.rob_instance.ROB_head
      ) < ( 3''d{i} - {cp}.rob_instance.ROB_head ) ) ) && ( ! {cp}.rob_instance.ROB_rs2_stall
      [{i}] || ( ( {cp}.rob_instance.ROB_rs2_ROBlink [{i}] - {cp}.rob_instance.ROB_head
      ) < ( 3''d{i} - {cp}.rob_instance.ROB_head ) ) ) )'
    name: rob_link_older
    range: 4
  - compare: equal_and_both
    invariant: '{cp}.rob_instance.ROB_state [{i}] == 0 || ( {cp}.rob_instance.ROB_mem_valid
      [{i}] == ( {cp}.rob_instance.ROB_op [{i}] == 3''d3 || {cp}.rob_instance.ROB_op
      [{i}] == 3''d4 ) && {cp}.rob_instance.ROB_mem_rdwt [{i}] == ( {cp}.rob_instance.ROB_op
      [{i}] == 3''d3 ) )'
    name: rob_mem_bits_legal
    range: 4
  - compare: equal_and_both
    invariant: '{cp}.rob_instance.ROB_state [{i}] == 0 || ( {cp}.rob_instance.ROB_is_br
      [{i}] == ( {cp}.rob_instance.ROB_op [{i}] == 3''d5 ) && {cp}.rob_instance.ROB_wen
      [{i}] == ( {cp}.rob_instance.ROB_op [{i}] <= 3''d3 ) && {cp}.rob_instance.ROB_rd_data_use_execute
      [{i}] == ( {cp}.rob_instance.ROB_op [{i}] <= 3''d2 ) )'
    name: rob_ctrl_flags_opcode
    range: 4
  ProgramEquivalence:
  - condition: []
    dataSignal: F_inst
    module: cpu_ooo
    width: 11
  contractObservation: []
  retirementPredicate:
    condition: []
    dataSignal: rob_instance.C_valid
    module: cpu_ooo
    width: 1
designMacro: []
designSrc: ../src/simpleooo
designTop: cpu_ooo
experimentalParameters:
  Hierarchy: true
  HoudiniExclude:
  - memd_instance\.memd
  - memi_instance\.array_mem
  HoudiniWires: true
  PipelineDrain: in-order
  Synch_level: RegMemStuttering
  Synch_method: direct
  Verification: Houdini
  k: 1
functionalInvariant:
- condition: []
  dataSignals:
  - F_opcode
  gateInvariant: \gate.F_opcode == 0 || \gate.F_opcode == 1 || \gate.F_opcode == 2
