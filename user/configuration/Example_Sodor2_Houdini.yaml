designSrc: "src/Sodor2" # Path to all your src design files
designTop: "SodorInternalTile_2stage"
instructionSet: "user/ISA/simpleoooISA.yaml"
targetPath: "results/Example_Sodor2_Houdini"

programFile: "positiveExample.mem"
secretAddressFile: "secret.mem"

avrPath: ""

designMacro: []   # Place the design that will be used with the Yosys script (if any or if relevant)

experimentalParameters:
  Synch_level: RegMemStuttering  # Select bewteen [HighLevelClock(stall), RegMemStuttering(stutter)]
  Synch_method: direct   # Select between [indirect(shadowLogic), direct(leave)]
  PipelineDrain: in-order # Select between [out-of-order, in-order]
  Verification: Houdini  # Select between [rIC3, AVR, Houdini]
  k: 1
  Hierarchy: false
  Solver: smtbmc            # rIC3 (default) | smtbmc
  SMTSolver: yices          # passed to yosys-smtbmc -s (yices, z3, bitwuzla, boolector...)
  SMTBMCPath: yosys-smtbmc  # optional, executable path
  SMTBMCOptions: ""         # optional, extra yosys-smtbmc flags
  HoudiniWires: true
  HoudiniExclude: ["AsyncScratchPadMemory_2stage.mem_0_0", "AsyncScratchPadMemory_2stage.mem_1_0", "AsyncScratchPadMemory_2stage.mem_2_0", "AsyncScratchPadMemory_2stage.mem_3_0", "AsyncScratchPadMemory_2stage.mem_0_1", "AsyncScratchPadMemory_2stage.mem_1_1", "AsyncScratchPadMemory_2stage.mem_2_1", "AsyncScratchPadMemory_2stage.mem_3_1"]
  
contract:

  contractObservation:
    # Contract discards deviation of the source observation
    - module: Core_2stage
      dataSignal: Core_2stage.CtlPath_2stage.branch_taken
      width: 32
      condition:
        - module: SodorInternalTile_2stage
          dataSignal: Core_2stage.CtlPath_2stage.branch_inst   
          condition: 1         
          width: 1

    - module: DatPath_2stage
      dataSignal: Core_2stage.DatPath_2stage.pc_retire
      condition: []

    - module: AsyncScratchPadMemory_2stage
      dataSignal: AsyncScratchPadMemory_2stage.instr_ctr
      condition: []

    - module: Core_2stage
      dataSignal: Core_2stage.DatPath_2stage.io_dmem_req_bits_addr_ctr
      condition: 
        - module: Core_2stage
          dataSignal: Core_2stage.CtlPath_2stage.io_dmem_req_valid_ctr 
          condition: 1
          width: 1


  Predicate: []
    # # When there is a load instruction, the data loaded should be the same
    # - name: RDATA_inv
