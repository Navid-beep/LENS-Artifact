    #   invariant: "{cp}.AsyncScratchPadMemory_2stage.io_core_ports_0_resp_bits_data_module_io_data"
    # # When the speculative fetch is correct, the instruction loaded should be the same
    # - name: INSTR_inv
    #   when: "( ! {cp}.Core_2stage.DatPath_2stage.io_ctl_if_kill_r )"
    #   invariant: "{cp}.Core_2stage.DatPath_2stage.exe_reg_inst"
    # # disclose the value of the program counter
    # - name: PC
    #   when: "{cp}.Core_2stage.DatPath_2stage.fetch_reg"
    #   invariant: "{cp}.Core_2stage.DatPath_2stage.filtered_if_reg_pc"
    # - name: PC1
    #   when: "{cp}.Core_2stage.DatPath_2stage.fetch_reg && ( ! {cp}.Core_2stage.DatPath_2stage.io_ctl_if_kill )"
    #   invariant: "{cp}.Core_2stage.DatPath_2stage.if_reg_pc"
    # - name: BRANCH
    #   when: "{cp}.Core_2stage.DatPath_2stage._if_pc_next_T_1 && {cp}.Core_2stage.DatPath_2stage._T"
    #   invariant: "{cp}.Core_2stage.DatPath_2stage.exe_br_target"
    # - name: PLUS4
    #   when: "{cp}.Core_2stage.DatPath_2stage._if_pc_next_T && {cp}.Core_2stage.DatPath_2stage._T"
    #   invariant: "{cp}.Core_2stage.DatPath_2stage.if_pc_plus4"
    # - name: JUMP
    #   when: "( ! {cp}.Core_2stage.DatPath_2stage._if_pc_next_T ) && ( ! {cp}.Core_2stage.DatPath_2stage._if_pc_next_T_1 ) && {cp}.Core_2stage.DatPath_2stage._T"
    #   invariant: "{cp}.Core_2stage.DatPath_2stage._if_pc_next_T_7"
    # - name: BRANCH1
    #   when: "{cp}.Core_2stage.DatPath_2stage.fetch"
    #   invariant: "{cp}.Core_2stage.DatPath_2stage._T && {cp}.Core_2stage.DatPath_2stage._if_pc_next_T_1"
    # - name: PLUS41
    #   when: "{cp}.Core_2stage.DatPath_2stage.fetch"
    #   invariant: "{cp}.Core_2stage.DatPath_2stage._T && {cp}.Core_2stage.DatPath_2stage._if_pc_next_T"
    # - name: JUMP1
    #   when: "{cp}.Core_2stage.DatPath_2stage.fetch"
    #   invariant: "{cp}.Core_2stage.DatPath_2stage._T && ( ! {cp}.Core_2stage.DatPath_2stage._if_pc_next_T_1 ) && ( ! {cp}.Core_2stage.DatPath_2stage._if_pc_next_T )"
