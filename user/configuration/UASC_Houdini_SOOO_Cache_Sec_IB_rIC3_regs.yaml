microArchitecture:
  # Memory where the program is stored (when not supported by Chipyard)

  clock: clk
  reset: rst

  rollbackSignal: 
    module: cpu_ooo
    dataSignal: C_squash

  bypassMem: 
    Condition: false
    Module: AsyncScratchPadMemory_2stage
    dataSignal: mem_

  # Memory where the program is stored
  instructionMemory:
    module: "memi"
    dataSignal: "array"
    addrSize: 8
    instrSize: 6

  # Memory where the secret is stored
  dataMemory:
    module: "memd"
    dataSignal: "memd"
    addrSize: 4
    dataSize: 4
    secret: 2

  # ROB Information
  ROB:
    isROB: True       # Declare if we have ROB (basically if CPU is In order or Out-of-Order, if In order CPU, provide a lookahead)
    lookahead: 30    # Maximum number of cycle an instruction can stay in the pipeline. This will be the unrolling of the design
    module: rob
    entries: 4
    headSignal: ROB_head
    tailSignal: ROB_tail
    # NOTE: This part is made after checking Ridecore --> Need to ensure that this can be generalised to other superscalar processors.

  COMMIT: 
    module: cpu_ooo
    commitBandWidth: 1   # is it a single issue or a super-scalar processor? 
    commitNumSignal:     # Name of the commit signals (list size must match what is given in )commitBandWidth 
      - C_valid           # It is assumed that the commit signal is true (1) when an instruction retires and false (0) when no instruction retires