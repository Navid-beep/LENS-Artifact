designSrc: "src/simpleooo_cache_secure" # Path to all your src design files
designTop: "cpu_ooo"
instructionSet: "user/ISA/simpleoooISA.yaml"
targetPath: "results/UASC_Houdini_SOOO_Cache_Sec_IB_rIC3_regs"

programFile: "positiveExample.mem"
secretAddressFile: "secret.mem"

avrPath: ""

vvp: "vvp"
iverilogPath: "iverilog"


designMacro: []   # Place the design that will be used with the Yosys script (if any or if relevant)

experimentalParameters:
  Synch_level: RegMemStuttering  # Select bewteen [HighLevelClock(stall), RegMemStuttering(stutter)]
  Synch_method: direct   # Select between [indirect(shadowLogic), direct(leave)]
  PipelineDrain: in-order # Select between [out-of-order, in-order]
  Verification: Houdini  # Select between [rIC3, AVR, Houdini]) -- /!\ For houdini, make sure the lookahead in ROB section is accurate
  k: 1 # depth of the k-induction
  Hierarchy: true
  # HoudiniWires: true
  HoudiniExclude: ['memd_instance\.memd', 'memi_instance\.array_mem']

contract:

  contractObservation:
    # Contract discards deviation of the source observation
    - module: cpu_ooo
      dataSignal: C_taken
      width: 1
      condition:
        - module: cpu_ooo
          dataSignal: C_is_br
          condition: 1
          width: 1

  ProgramEquivalence:
    - module: memi
      dataSignal: array_mem
      width: 11
      range: 8
      condition: []

# Note that for predicate, you must put the complete path
  Predicate: 
    - name: rename_points_to_live_writer
      range: 4
      compare: equal_and_both
      invariant: "! {cp}.renameTable_instance.renameTB_valid [{i}] || ( {cp}.rob_instance.ROB_state [ {cp}.renameTable_instance.renameTB_ROBlink [{i}] ] != 0 && {cp}.rob_instance.ROB_wen [ {cp}.renameTable_instance.renameTB_ROBlink [{i}] ] && {cp}.rob_instance.ROB_rd [ {cp}.renameTable_instance.renameTB_ROBlink [{i}] ] == 2'd{i} )"
    - name: rob_next_pc_finished
      range: 4
      compare: equal_and_both
      invariant: "( {cp}.rob_instance.ROB_state [{i}] != 3 && {cp}.rob_instance.ROB_state [{i}] != 4 && {cp}.rob_instance.ROB_state [{i}] != 5 ) || {cp}.rob_instance.ROB_next_pc [{i}] == ( ( {cp}.rob_instance.ROB_is_br [{i}] && {cp}.rob_instance.ROB_taken [{i}] ) ? ( {cp}.rob_instance.ROB_pc [{i}] + {cp}.rob_instance.ROB_rs1_br_offset [{i}] ) : ( {cp}.rob_instance.ROB_pc [{i}] + 3'd1 ) )"
    # Fetch predicts not-taken (F_taken is tied to 0 in this design)
    - name: rob_no_prediction
      compare: equal_and_both
      invariant: "{cp}.rob_instance.ROB_predicted_taken == 4'd0"

    # Only loads occupy the miss states 3/4
    - name: rob_miss_states_load
      range: 4
      compare: equal_and_both
      invariant: "( {cp}.rob_instance.ROB_state [{i}] != 3 && {cp}.rob_instance.ROB_state [{i}] != 4 ) || {cp}.rob_instance.ROB_op [{i}] == 3'd3"

    # (1b) mitigation: a load past issue (state 2/3/4) is at the ROB head
    - name: rob_ld_issued_at_head
      range: 4
      compare: equal_and_both
      invariant: "{cp}.rob_instance.ROB_op [{i}] != 3'd3 || ( {cp}.rob_instance.ROB_state [{i}] != 2 && {cp}.rob_instance.ROB_state [{i}] != 3 && {cp}.rob_instance.ROB_state [{i}] != 4 ) || {cp}.rob_instance.ROB_head == 2'd{i}"

    # (2) a load in the miss states missed, and the cache is not filled until it leaves state 4
    - name: rob_miss_addr_not_cached
      range: 4
      compare: equal_and_both
      invariant: "( {cp}.rob_instance.ROB_state [{i}] != 3 && {cp}.rob_instance.ROB_state [{i}] != 4 ) || {cp}.rob_instance.ROB_mem_addr [{i}] != {cp}.rob_instance.cached_addr"

    # (3) a consumer with a pending operand link has not issued, and its producer is still in the ROB
    - name: rob_rs1_pending_link
      range: 4
      compare: equal_and_both
      invariant: "{cp}.rob_instance.ROB_state [{i}] == 0 || ! {cp}.rob_instance.ROB_rs1_stall [{i}] || ( {cp}.rob_instance.ROB_state [{i}] == 1 && {cp}.rob_instance.ROB_state [ {cp}.rob_instance.ROB_rs1_ROBlink [{i}] ] != 0 )"
    - name: rob_rs2_pending_link
      range: 4
      compare: equal_and_both
      invariant: "{cp}.rob_instance.ROB_state [{i}] == 0 || ! {cp}.rob_instance.ROB_rs2_stall [{i}] || ( {cp}.rob_instance.ROB_state [{i}] == 1 && {cp}.rob_instance.ROB_state [ {cp}.rob_instance.ROB_rs2_ROBlink [{i}] ] != 0 )"
# End of RawInvariants

    - name: cached_addr_equiv
      invariant: "{cp}.rob_instance.cached_addr"
      compare: equal
      
    - name: ld_ready_equiv
      range: 4
      compare: equal
      invariant: "{cp}.rob_instance.ROB_op [{i}] == 3'd3 && ( {cp}.rob_instance.ROB_state [{i}] == 3'd2 || {cp}.rob_instance.ROB_state [{i}] == 3'd5 )"
    
    - name: ld_ready_only_at_head
      range: 4
      compare: equal_and_both
      invariant: "!( {cp}.rob_instance.ROB_op [{i}] == 3'd3 && ( {cp}.rob_instance.ROB_state [{i}] == 3'd2 || {cp}.rob_instance.ROB_state [{i}] == 3'd5 ) ) || {cp}.rob_instance.ROB_head == 3'd{i}"
    
# Circular buffer ROB: an entry is occupied iff it is inside the head..tail window
    - name: rob_window_occupancy
      range: 4
      compare: equal_and_both
      invariant: "( !( ( 3'd{i} - {cp}.rob_instance.ROB_head ) < ( {cp}.rob_instance.ROB_tail - {cp}.rob_instance.ROB_head ) ) || {cp}.rob_instance.ROB_state [{i}] != 0 ) && ( ( ( 3'd{i} - {cp}.rob_instance.ROB_head ) < ( {cp}.rob_instance.ROB_tail - {cp}.rob_instance.ROB_head ) ) || {cp}.rob_instance.ROB_state [{i}] == 0 || ( {cp}.rob_instance.ROB_tail == {cp}.rob_instance.ROB_head && {cp}.rob_instance.ROB_state [ {cp}.rob_instance.ROB_head ] != 0 ) ) && ( {cp}.rob_instance.ROB_tail != {cp}.rob_instance.ROB_head || ( {cp}.rob_instance.ROB_state [{i}] != 0 ) == ( {cp}.rob_instance.ROB_state [ {cp}.rob_instance.ROB_head ] != 0 ) )"

    # Avoid instructions waiting for themselves: a pending link points to an older entry
    - name: rob_link_older
      range: 4
      compare: equal_and_both
      invariant: "{cp}.rob_instance.ROB_state [{i}] == 0 || ( ( ! {cp}.rob_instance.ROB_rs1_stall [{i}] || ( ( {cp}.rob_instance.ROB_rs1_ROBlink [{i}] - {cp}.rob_instance.ROB_head ) < ( 3'd{i} - {cp}.rob_instance.ROB_head ) ) ) && ( ! {cp}.rob_instance.ROB_rs2_stall [{i}] || ( ( {cp}.rob_instance.ROB_rs2_ROBlink [{i}] - {cp}.rob_instance.ROB_head ) < ( 3'd{i} - {cp}.rob_instance.ROB_head ) ) ) )"

    # Memory access bits are legal
    - name: rob_mem_bits_legal
      range: 4
      compare: equal_and_both
      invariant: "{cp}.rob_instance.ROB_state [{i}] == 0 || ( {cp}.rob_instance.ROB_mem_valid [{i}] == ( {cp}.rob_instance.ROB_op [{i}] == 3'd3 || {cp}.rob_instance.ROB_op [{i}] == 3'd4 ) && {cp}.rob_instance.ROB_mem_rdwt [{i}] == ( {cp}.rob_instance.ROB_op [{i}] == 3'd3 ) )"

    # Control flags are consistent with the opcode
    - name: rob_ctrl_flags_opcode
      range: 4
      compare: equal_and_both
      invariant: "{cp}.rob_instance.ROB_state [{i}] == 0 || ( {cp}.rob_instance.ROB_is_br [{i}] == ( {cp}.rob_instance.ROB_op [{i}] == 3'd5 ) && {cp}.rob_instance.ROB_wen [{i}] == ( {cp}.rob_instance.ROB_op [{i}] <= 3'd3 ) && {cp}.rob_instance.ROB_rd_data_use_execute [{i}] == ( {cp}.rob_instance.ROB_op [{i}] <= 3'd2 ) )"

  AttackerObservation:
  # Commit Observation
    - module: rob
      dataSignal: C_valid
      width: 1
      name: commit
      condition: []


  retirementPredicate:
    # Instruction Retirement Signal
      module: cpu_ooo
      dataSignal: C_valid
      width: 1
      condition: []

functionalInvariant: 
     - module: cpu_ooo  
       dataSignals: [F_opcode]     # List of all signals present in the functional invariant
       invariant: F_opcode == 0 || F_opcode == 1 || F_opcode == 2 || F_opcode == 3 || F_opcode == 4 || F_opcode == 5  # the plaintext function invariant you want to set
       condition: []  

     - module: rob
       dataSignals: [ROB_state, ROB_op]
       invariant: "ROB_state [0] == 0 || ROB_op [0] <= 5"
       condition: []

     - module: rob
       dataSignals: [ROB_state, ROB_op]
       invariant: "ROB_state [1] == 0 || ROB_op [1] <= 5"
       condition: []

     - module: rob
       dataSignals: [ROB_state, ROB_op]
       invariant: "ROB_state [2] == 0 || ROB_op [2] <= 5"
       condition: []

     - module: rob
       dataSignals: [ROB_state, ROB_op]
       invariant: "ROB_state [3] == 0 || ROB_op [3] <= 5"
       condition: []

# ROB Legal State

     - module: rob
       dataSignals: [ROB_state]
       invariant: "ROB_state [0] == 0 || ROB_state [0] == 1 || ROB_state [0] == 2 || ROB_state [0] == 3 || ROB_state [0] == 4 || ROB_state [0] == 5"
       condition: []

     - module: rob
       dataSignals: [ROB_state]
       invariant: "ROB_state [1] == 0 || ROB_state [1] == 1 || ROB_state [1] == 2 || ROB_state [1] == 3 || ROB_state [1] == 4 || ROB_state [1] == 5"
       condition: []

     - module: rob
       dataSignals: [ROB_state]
       invariant: "ROB_state [2] == 0 || ROB_state [2] == 1 || ROB_state [2] == 2 || ROB_state [2] == 3 || ROB_state [2] == 4 || ROB_state [2] == 5"
       condition: []

     - module: rob
       dataSignals: [ROB_state]
       invariant: "ROB_state [3] == 0 || ROB_state [3] == 1 || ROB_state [3] == 2 || ROB_state [3] == 3 || ROB_state [3] == 4 || ROB_state [3] == 5"
       condition: []


